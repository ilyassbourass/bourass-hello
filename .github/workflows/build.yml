name: Build iOS

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  simulator-check:
    name: Build check no signing
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: brew install xcodegen
      - run: xcodegen generate
      - run: |
          xcodebuild build \
            -project BourassHello.xcodeproj \
            -scheme BourassHello \
            -sdk iphonesimulator \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath build
      - name: Run in simulator and screenshot
        run: |
          UDID=$(xcrun simctl list devices available | grep -m 1 "iPhone" | grep -Eo '[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}')
          echo "SIM: $UDID"
          xcrun simctl boot "$UDID" || true
          APP=$(find build/Build/Products -maxdepth 2 -name "*.app" | head -1)
          echo "App: $APP"
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" com.bourass.hello || true
          sleep 5
          xcrun simctl io "$UDID" screenshot screenshot.png
          xcrun simctl shutdown "$UDID" || true
      - uses: actions/upload-artifact@v4
        with:
          name: simulator-screenshot
          path: screenshot.png
          retention-days: 7

  device-build:
    name: Build unsigned IPA for Sideloadly
    runs-on: macos-14
    needs: simulator-check
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Build for real iPhone signing disabled
        run: |
          xcodebuild build \
            -project BourassHello.xcodeproj \
            -scheme BourassHello \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath buildDevice
      - name: Package unsigned IPA
        run: |
          APP=$(find buildDevice/Build/Products -maxdepth 2 -name "*.app" | head -1)
          echo "App: $APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -r BourassHello-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: BourassHello-unsigned-ipa
          path: BourassHello-unsigned.ipa
          retention-days: 30
